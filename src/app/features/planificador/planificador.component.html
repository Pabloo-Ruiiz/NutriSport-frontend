<header class="ns-plan__cabecera">
  <nav class="ns-plan__semana" aria-label="Semana">
    <button type="button" class="ns-plan__flecha" aria-label="Semana anterior" (click)="semanaAnterior()">
      <svg lucideIcon="chevron-left" [size]="20" aria-hidden="true"></svg>
    </button>
    <h2 class="ns-plan__etiqueta ns-text-h4" aria-live="polite">
      <span class="ns-sr-only">Semana del </span>{{ etiqueta() }}
    </h2>
    <button type="button" class="ns-plan__flecha" aria-label="Semana siguiente" (click)="semanaSiguiente()">
      <svg lucideIcon="chevron-right" [size]="20" aria-hidden="true"></svg>
    </button>
    @if (!esSemanaActual()) {
      <button nsButton type="button" variant="ghost" size="sm" (click)="irASemanaActual()">Esta semana</button>
    }
  </nav>

  @if (opcionesMenu().length > 0) {
    <ns-select
      class="ns-plan__selector"
      etiqueta="Menú de la semana"
      [opciones]="opcionesMenu()"
      [ngModel]="menu()?.id ?? null"
      (ngModelChange)="seleccionarMenu($event)"
    />
  }

  <div class="ns-plan__acciones">
    <button
      nsButton
      type="button"
      variant="secondary"
      icon="shopping-basket"
      [disabled]="!menu()"
      (click)="listaCompra()"
    >
      Lista de la compra
    </button>
    <button nsButton type="button" icon="plus" (click)="generar()">Generar menú</button>
    @if (menu(); as m) {
      <button
        type="button"
        class="ns-plan__mas"
        aria-label="Más acciones del menú"
        [disabled]="ocupado()"
        [cdkMenuTriggerFor]="acciones"
      >
        <svg lucideIcon="ellipsis" [size]="20" aria-hidden="true"></svg>
      </button>

      <ng-template #acciones>
        <div class="ns-menu" cdkMenu>
          <button type="button" class="ns-menu__item" cdkMenuItem (cdkMenuItemTriggered)="cambiarFavorito(m)">
            <svg lucideIcon="heart" [size]="18" aria-hidden="true"></svg>
            {{ m.favorito ? 'Quitar de favoritos' : 'Guardar como favorito' }}
          </button>
          <button type="button" class="ns-menu__item" cdkMenuItem (cdkMenuItemTriggered)="renombrar(m)">
            <svg lucideIcon="pencil" [size]="18" aria-hidden="true"></svg>
            Renombrar
          </button>
          <button type="button" class="ns-menu__item" cdkMenuItem (cdkMenuItemTriggered)="cambiarArchivado(m)">
            <svg lucideIcon="archive" [size]="18" aria-hidden="true"></svg>
            {{ m.estado === 'ARCHIVADO' ? 'Reactivar' : 'Archivar' }}
          </button>
          <button type="button" class="ns-menu__item" cdkMenuItem (cdkMenuItemTriggered)="duplicar(m)">
            <svg lucideIcon="copy" [size]="18" aria-hidden="true"></svg>
            Duplicar en otra semana
          </button>
          <hr class="ns-menu__separador" />
          <button
            type="button"
            class="ns-menu__item ns-menu__item--peligro"
            cdkMenuItem
            (cdkMenuItemTriggered)="eliminar(m)"
          >
            <svg lucideIcon="trash" [size]="18" aria-hidden="true"></svg>
            Eliminar
          </button>
        </div>
      </ng-template>
    }
  </div>
</header>

@if (store.error(); as error) {
  <ns-alert type="error" titulo="No hemos podido cargar el menú">
    {{ error }}
    <button nsAlertAcciones nsButton type="button" variant="secondary" size="sm" (click)="store.cargar()">
      Reintentar
    </button>
  </ns-alert>
}

@if (menu(); as m) {
  <section class="ns-plan__contenido" aria-labelledby="ns-plan-nombre" [attr.aria-busy]="store.cargando()">
    <h2 class="ns-sr-only" id="ns-plan-nombre">{{ m.nombre }}</h2>
    <app-resumen-semana [menu]="m" />
    @if (esMovil()) {
      <app-dia-planificador [menu]="m" [fecha]="fechaDia()" (fechaChange)="elegirDia($event)" [hoy]="hoy" />
    } @else {
      <app-week-planner [menu]="m" [semana]="store.semana()" [hoy]="hoy" />
    }
  </section>
} @else if (store.cargando()) {
  <div class="ns-plan__cargando" aria-busy="true" aria-label="Cargando el menú">
    <ns-skeleton shape="rect" height="96px" />
    <ns-skeleton shape="rect" height="360px" />
  </div>
} @else if (!store.error()) {
  <ns-empty-state
    icon="calendar"
    titulo="No tienes menú para esta semana"
    descripcion="Genera un menú con tus recetas, ajustado a tu objetivo y a tus entrenamientos."
  >
    <button nsButton type="button" icon="plus" (click)="generar()">Generar menú</button>
  </ns-empty-state>
}
